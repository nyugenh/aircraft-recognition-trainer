<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c141b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Aircraft recognition practice for trainee air traffic controllers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aircraft Recognition Trainer" />
    <meta
      property="og:description"
      content="Aircraft recognition practice for trainee air traffic controllers."
    />
    <meta
      property="og:image"
      content="https://nyugenh.github.io/aircraft-recognition-trainer/thumbnail.jpg"
    />
    <meta property="og:url" content="https://nyugenh.github.io/aircraft-recognition-trainer/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aircraft Recognition Trainer" />
    <meta
      name="twitter:description"
      content="Aircraft recognition practice for trainee air traffic controllers."
    />
    <meta
      name="twitter:image"
      content="https://nyugenh.github.io/aircraft-recognition-trainer/thumbnail.jpg"
    />
    <title>Aircraft Recognition Trainer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app" aria-describedby="keyboard-shortcuts-help">
      <!-- 1. Header & Score -->
      <header class="header">
        <h1 id="app-title" data-full="Aircraft Recognition Trainer" data-short="Aircraft Trainer">Aircraft Recognition Trainer</h1>
        <button id="photo-toggle" class="photo-toggle" type="button" hidden>
          Show photos
        </button>
        <button
          id="settings-toggle"
          class="settings-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="quiz-settings"
        >
          Settings
        </button>
        <div id="score" class="score" aria-live="polite" aria-atomic="true">
          Score: 0/0 (0%)
        </div>
      </header>

      <!-- 2. Quiz Controls -->
      <section
        id="quiz-settings"
        class="controls"
        aria-label="Quiz settings"
        hidden
      >
        <label for="category">
          Category
          <select id="category" name="category">
            <option value="All">All</option>
          </select>
        </label>
        <label for="question-type">
          Question
          <select id="question-type" name="question-type">
            <option value="photo">Photo → identify</option>
            <option value="name">Name → identify</option>
            <option value="icao">ICAO → identify</option>
            <option value="cruise">Cruise speed</option>
            <option value="climb">Climb speed</option>
            <option value="descent">Descent speed</option>
            <option value="wake">Wake category</option>
          </select>
        </label>
        <label id="speed-mode-label" for="speed-mode" hidden>
          Mode
          <select id="speed-mode" name="speed-mode">
            <option value="estimate">Estimate</option>
            <option value="compare">Compare</option>
            <option value="rank">Rank</option>
          </select>
        </label>
        <label id="answer-type-label" for="answer-type">
          Answer
          <select id="answer-type" name="answer-type">
            <option value="name">Name (choose)</option>
            <option value="icao">ICAO (choose)</option>
            <option value="photo">Photo (choose)</option>
            <option value="enter-name">Name (type)</option>
            <option value="enter-icao">ICAO (type)</option>
          </select>
        </label>
      </section>

      <!-- 3. Aircraft Image Container -->
      <section
        id="image-container"
        class="image-container"
        aria-label="Aircraft image"
      >
        <img
          id="aircraft-image"
          alt="Aircraft recognition question"
          draggable="false"
        />
        <div id="loading-message" class="loading-message hidden"></div>
      </section>

      <!-- 5. Question Prompt -->
      <p
        id="prompt"
        class="prompt"
        aria-live="polite"
        aria-atomic="true"
        tabindex="-1"
      >
        Loading aircraft…
      </p>

      <!-- 6. Speed Ranking Mode Section -->
      <section
        id="speed-ranking"
        class="speed-ranking"
        hidden
        aria-label="Aircraft speed ranking"
      >
        <ol id="speed-ranking-list"></ol>
        <button id="check-ranking" type="button">Check ranking</button>
      </section>

      <!-- 7. Multiple-Choice Answers -->
      <section id="answers" class="answers" aria-label="Answer choices">
        <button type="button" disabled>
          <span class="shortcut-badge" aria-hidden="true">1</span
          ><span class="option-text">Option 1</span>
        </button>
        <button type="button" disabled>
          <span class="shortcut-badge" aria-hidden="true">2</span
          ><span class="option-text">Option 2</span>
        </button>
        <button type="button" disabled>
          <span class="shortcut-badge" aria-hidden="true">3</span
          ><span class="option-text">Option 3</span>
        </button>
        <button type="button" disabled>
          <span class="shortcut-badge" aria-hidden="true">4</span
          ><span class="option-text">Option 4</span>
        </button>
      </section>

      <!-- 8. Typed Answer Form -->
      <form id="type-answer-container" class="type-answer-container" hidden>
        <label class="visually-hidden" for="type-answer-input"
          >Your answer</label
        >
        <input
          id="type-answer-input"
          class="type-answer-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Type your answer"
          disabled
        />
        <button id="submit-answer" class="submit-answer" type="button" disabled>
          Submit
        </button>
      </form>

      <!-- 8b. Speed Estimate Slider -->
      <div id="speed-slider" class="speed-slider" hidden>
        <output
          id="speed-slider-value"
          class="speed-slider-value"
          for="speed-slider-input"
          >0 kt</output
        >
        <div class="speed-slider-track">
          <input
            id="speed-slider-input"
            class="speed-slider-input"
            type="range"
            aria-label="Estimated speed in knots"
          />
          <span
            id="speed-slider-answer"
            class="speed-slider-answer"
            aria-hidden="true"
            hidden
          ></span>
        </div>
        <div class="speed-slider-scale" aria-hidden="true">
          <span id="speed-slider-min"></span>
          <span id="speed-slider-max"></span>
        </div>
        <button id="speed-slider-submit" class="submit-answer" type="button">
          Lock in
        </button>
      </div>

      <!-- 9. Footer, Status & Progression -->
      <footer class="bottom">
        <div class="status">
          <div
            id="feedback"
            class="feedback"
            aria-live="polite"
            aria-atomic="true"
          ></div>
        </div>
        <button id="next" class="next-button" type="button" disabled>
          Next aircraft
        </button>
      </footer>
    </main>
    <dialog
      id="photo-viewer"
      class="photo-viewer"
      aria-label="Aircraft photo viewer"
    >
      <div class="photo-viewer-panel">
        <header class="photo-viewer-header">
          <p id="photo-viewer-title" class="photo-viewer-title">
            Aircraft photo
          </p>
          <button
            id="photo-viewer-close"
            class="photo-viewer-close"
            type="button"
            aria-label="Close photo viewer"
          >
            <svg class="viewer-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div id="photo-viewer-stage" class="photo-viewer-stage">
          <img id="photo-viewer-image" alt="" draggable="false" />
        </div>
        <footer class="photo-viewer-controls" aria-label="Photo zoom controls">
          <button id="photo-zoom-out" type="button" aria-label="Zoom out">
            <svg class="viewer-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          </button>
          <output id="photo-zoom-level" for="photo-zoom-out photo-zoom-in">
            100%
          </output>
          <button id="photo-zoom-in" type="button" aria-label="Zoom in">
            <svg class="viewer-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
          <button id="photo-zoom-reset" type="button">Reset</button>
          <span class="photo-viewer-help">
            Scroll or pinch to zoom · drag to move
          </span>
        </footer>
      </div>
    </dialog>
  </body>
</html>

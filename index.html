<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fa" />
    <meta
      name="description"
      content="Aircraft recognition practice for trainee air traffic controllers."
    />
    <title>Aircraft Recognition Trainer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app" aria-describedby="keyboard-shortcuts-help">
      <header class="header">
        <h1>Aircraft Recognition Trainer</h1>
        <div id="score" class="score" aria-live="polite">Score: 0/0 (0%)</div>
      </header>
      <section class="controls" aria-label="Quiz settings">
        <label for="category"
          >Category
          <select id="category" name="category">
            <option value="All">All</option>
          </select>
        </label>
        <label for="question-type"
          >Question
          <select id="question-type" name="question-type">
            <option value="photo">Photo → identify</option>
            <option value="name">Name → identify</option>
            <option value="icao">ICAO → identify</option>
            <option value="speed">Compare speeds</option>
            <option value="cruise-speed">Estimate speed</option>
            <option value="rank-speed">Rank speeds</option>
            <option value="wake">Wake category</option>
          </select>
        </label>
        <label id="answer-type-label" for="answer-type"
          >Answer
          <select id="answer-type" name="answer-type">
            <option value="name">Name (choose)</option>
            <option value="icao">ICAO (choose)</option>
            <option value="photo">Photo (choose)</option>
            <option value="enter-name">Name (type)</option>
            <option value="enter-icao">ICAO (type)</option>
          </select>
        </label>
      </section>
      <button id="photo-toggle" class="photo-toggle" type="button" hidden>
        Show photos
      </button>
      <section
        id="image-container"
        class="image-container"
        aria-label="Aircraft image"
      >
        <img
          id="aircraft-image"
          alt="Aircraft recognition question"
          draggable="false"
        />
        <div id="loading-message" class="loading-message hidden">
          Loading aircraft…
        </div>
      </section>
      <p
        id="prompt"
        class="prompt"
        aria-live="polite"
        aria-atomic="true"
        tabindex="-1"
      ></p>
      <section
        id="speed-ranking"
        class="speed-ranking"
        hidden
        aria-label="Aircraft speed ranking"
      >
        <ol id="speed-ranking-list"></ol>
        <button id="check-ranking" type="button">Check ranking</button>
      </section>
      <section id="answers" class="answers" aria-label="Answer choices">
        <button type="button" disabled>Option 1</button>
        <button type="button" disabled>Option 2</button>
        <button type="button" disabled>Option 3</button>
        <button type="button" disabled>Option 4</button>
      </section>
      <form id="type-answer-container" class="type-answer-container" hidden>
        <label class="visually-hidden" for="type-answer-input"
          >Your answer</label
        >
        <input
          id="type-answer-input"
          class="type-answer-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Type your answer"
          disabled
        />
        <button id="submit-answer" class="submit-answer" type="button" disabled>
          Submit
        </button>
      </form>
      <footer class="bottom">
        <div class="status">
          <div
            id="feedback"
            class="feedback"
            aria-live="polite"
            aria-atomic="true"
          ></div>
        </div>
        <button id="next" class="next-button" type="button" disabled>
          Next aircraft
        </button>
      </footer>
    </main>
  </body>
</html>
